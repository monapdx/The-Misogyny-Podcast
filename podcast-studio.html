<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Misogyny Podcast — Studio</title>
<style>
:root{font:15px/1.45 system-ui,Segoe UI,sans-serif;color:#24222b;background:#c9bbf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% 15%,#ffb7d5 0 15%,transparent 38%),radial-gradient(circle at 85% 80%,#8be8e4 0 12%,transparent 38%),#c9bbf6}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #00bdb9;outline-offset:2px}.top{height:51px;background:#24222b;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:4px solid #ff36ac}.brand{font-weight:900;letter-spacing:.06em}.brand span{color:#ff71c0}.top button{background:#fff;border:2px solid #fff;padding:4px 9px;font-size:12px;font-weight:700}.desktop{display:flex;gap:16px;padding:22px;min-height:calc(100vh - 101px)}.icons{width:124px;flex:none;display:flex;flex-direction:column;gap:10px}.icon{border:2px solid transparent;background:transparent;text-align:center;padding:7px 3px;font-weight:800;color:#25202d;text-shadow:0 1px #fff}.icon:hover,.icon.active{background:#ffffffaa;border-color:#25202d}.glyph{display:grid;place-items:center;margin:auto auto 5px;width:52px;height:48px;background:#fff;border:3px solid #24222b;box-shadow:4px 4px 0 #24222b;font-size:26px;text-shadow:none}.window{width:min(1100px,calc(100vw - 190px));min-height:640px;margin:auto;border:3px solid #25222d;box-shadow:9px 9px 0 #25222d;background:#f8f5ef}.windowbar{background:#24222b;color:white;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:800}.dots{color:#ff5cb8;letter-spacing:3px}.windowbar small{margin-left:auto;color:#cfc5e5}.inside{padding:24px}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:3px solid #25222d;padding-bottom:14px;margin-bottom:18px}.heading h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.04em;line-height:1;margin:0}.heading p{margin:7px 0 0;color:#625e69}.btn{border:2px solid #24222b;background:#d3ff5d;padding:8px 13px;font-weight:800;box-shadow:3px 3px 0 #24222b}.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #24222b}.btn.secondary{background:#fff}.btn.pink{background:#ffaad4}.btn.danger{background:#fff0f0;color:#9a2439}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 15px}.toolbar input,.toolbar select{border:2px solid #24222b;background:white;padding:8px;min-width:160px}.toolbar input{flex:1}.layout{display:grid;grid-template-columns:minmax(250px,38%) 1fr;border:2px solid #25222d;min-height:420px}.list{border-right:2px solid #25222d;background:#fff;max-height:62vh;overflow:auto}.row{width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #d8d3da;padding:12px;display:block}.row:hover,.row.selected{background:#e8e0ff}.row strong,.row small{display:block}.row small{color:#6a6270;margin-top:3px}.preview{padding:20px;overflow:auto;max-height:62vh;white-space:pre-wrap}.preview h2{margin:0 0 7px;line-height:1.15}.meta{color:#67616e;font-size:13px;margin:0 0 17px}.pill{display:inline-block;background:#e2d6ff;border:1px solid #25222d;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;margin-right:5px}.empty{color:#736d78;padding:30px;text-align:center}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{border:2px solid #25222d;box-shadow:4px 4px 0 #25222d;background:#fff;padding:16px;text-align:left}.card:hover{background:#e9e0ff}.card b{display:block;font-size:28px}.card span{font-weight:800}.field{display:flex;flex-direction:column;gap:5px;margin:0 0 14px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:2px solid #24222b;background:white;padding:9px}.field textarea{min-height:230px;resize:vertical;font:15px/1.5 Consolas,monospace}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wide{grid-column:1/-1}.status{position:fixed;bottom:0;left:0;right:0;height:34px;padding:7px 14px;background:#24222b;color:#fff;font-size:12px;display:flex;justify-content:space-between}.note{background:#fff5bd;border:2px solid #24222b;padding:12px;margin:15px 0}.muted{color:#68616e}.desktoplink{font-weight:800;text-decoration:underline;cursor:pointer}@media(max-width:750px){.desktop{display:block;padding:12px}.icons{width:auto;flex-direction:row;overflow-x:auto;margin-bottom:16px}.icon{min-width:95px}.window{width:100%;min-height:550px}.inside{padding:15px}.layout{display:block}.list{max-height:220px;border-right:0;border-bottom:2px solid #24222b}.preview{max-height:none}.formgrid{display:block}}
</style>
</head>
<body>
<div class="top"><div class="brand">THE MISOGYNY PODCAST <span>▸ STUDIO</span></div><button id="backupTop">BACKUP DATA ↓</button></div>
<div class="desktop"><nav class="icons" id="icons" aria-label="Studio apps"></nav><main class="window"><div class="windowbar"><span class="dots">● ● ●</span><span id="windowTitle"></span><small>LOCAL WORKSPACE / v0.1</small></div><div class="inside" id="app"></div></main></div>
<div class="status"><span>THE MISOGYNY PODCAST // INTERNAL USE ONLY</span><span id="saveStatus">Saved in this browser</span></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(()=>{'use strict';
const KEY='tmp-studio-v1'; const TYPES=['Guest pitch','Hatemail','Questions','Challenges','Support'];
const APPS=[['home','⌂','Desktop'],['paul','✉','Paul’s Inbox'],['derek','✉','Derek’s Inbox'],['submissions','▤','Submissions'],['episodes','▶','Episode Archive'],['desk','✎','Writing Desk'],['settings','⚙','Data & Settings']];
let state=read(),app='home',selected=null,filter='',query='',editing=null;
function read(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&Array.isArray(v.items))return v}catch(e){}return{version:1,items:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Saved in this browser'}catch(e){alert('Storage is full or unavailable. Export a backup before closing this page.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stamp(s){return s?new Date(s).toLocaleString():''}function count(kind){return state.items.filter(x=>x.kind===kind).length}
function go(next){app=next;selected=null;editing=null;query='';filter='';render()}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});download(blob,'misogyny-studio-backup-'+new Date().toISOString().slice(0,10)+'.json')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function exportItem(x){const ext=x.format==='html'?'html':x.format==='markdown'?'md':'txt';download(new Blob([x.body||''],{type:ext==='html'?'text/html':'text/plain'}),(x.title||'untitled').replace(/[^a-z0-9-_ ]/gi,'').trim().replace(/\s+/g,'-').toLowerCase()+'.'+ext)}
function heading(title,desc,action){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${action||''}</div>`}
function render(){document.getElementById('icons').innerHTML=APPS.map(([id,icon,label])=>`<button class="icon ${id===app?'active':''}" data-app="${id}"><span class="glyph">${icon}</span>${label}</button>`).join('');document.getElementById('windowTitle').textContent=APPS.find(x=>x[0]===app)[2].toUpperCase();const root=document.getElementById('app');root.innerHTML=app==='home'?home():app==='settings'?settings():editing!==null?editor():listing();bind()}
function home(){return heading('Production desktop','A private, local workspace for the show.')+`<div class="cards">${[['paul','Paul’s Inbox',count('paul'),'Messages and drafts for Paul'],['derek','Derek’s Inbox',count('derek'),'Messages and drafts for Derek'],['submissions','Submissions',count('submission'),'Pitches, hatemail, and listener mail'],['episodes','Episode Archive',count('episode'),'Scripts, pages, and release notes'],['desk','Writing Desk',count('draft'),'Unfinished pieces and fragments']].map(([id,name,n,sub])=>`<button class="card" data-app="${id}"><b>${n}</b><span>${name}</span><p class="muted">${sub}</p></button>`).join('')}</div><div class="note"><b>Start anywhere.</b> Create a record in an inbox, submission queue, archive, or writing desk. Use <b>Data & Settings</b> to back up the entire workspace as JSON. Everything stays on this computer in this browser profile.</div>`}
function settings(){return heading('Data & Settings','Take the workspace with you.')+`<div class="actions"><button class="btn" data-action="backup">Download full backup</button><button class="btn secondary" data-action="import">Import backup</button></div><p>${state.items.length} total records. A backup contains every record, including drafts and text.</p><div class="note">This standalone file stores data in your browser’s local storage. Make backups regularly, especially before clearing browser data, changing browsers, or moving the HTML file. Import replaces the current workspace after confirmation.</div><p class="muted">Content exports from individual records preserve plain text, Markdown, or HTML exactly as written. The archive does not publish anything automatically.</p>`}
function currentKind(){return app==='desk'?'draft':app==='episodes'?'episode':app==='submissions'?'submission':app}
function listing(){let kind=currentKind(),items=state.items.filter(x=>x.kind===kind).sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));let title=APPS.find(x=>x[0]===app)[2];let desc={paul:'Correspondence, responses, and unsent drafts.',derek:'Messages addressed to Derek and the replies he should probably reconsider.',submissions:'Sort incoming pitches and material by type and status.',episodes:'Keep published and planned episodes together.',desk:'Develop scripts, fragments, dialogue, and standalone pieces.'}[app];let labels=kind==='submission'?TYPES:kind==='episode'?['Planned','Draft','Published']:kind==='draft'?['Script','Dialogue','Idea','Other']:['Inbox','Draft','Sent'];let shown=items.filter(x=>(!filter||x.label===filter)&&(!query||[x.title,x.from,x.to,x.body,x.label,...Object.values(x.meta||{})].join(' ').toLowerCase().includes(query.toLowerCase())));if(!shown.some(x=>x.id===selected))selected=shown[0]?.id||null;let picked=shown.find(x=>x.id===selected);
return heading(title,desc,`<button class="btn pink" data-action="new">+ New record</button>`)+`<div class="toolbar"><input id="search" placeholder="Search this app…" value="${esc(query)}" aria-label="Search records"><select id="filter" aria-label="Filter by label"><option value="">All labels</option>${labels.map(l=>`<option ${filter===l?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="layout"><div class="list">${shown.length?shown.map(x=>`<button class="row ${x.id===selected?'selected':''}" data-select="${esc(x.id)}"><strong>${esc(x.title||'Untitled')}</strong><small>${esc(x.label||'')} · ${esc(x.from||x.to||'')} ${stamp(x.updated)}</small></button>`).join(''):`<div class="empty">No records here yet.</div>`}</div><article class="preview">${picked?`<h2>${esc(picked.title||'Untitled')}</h2><div class="meta"><span class="pill">${esc(picked.label)}</span> ${esc(picked.status||'')}<br>${picked.from?'From: '+esc(picked.from)+'<br>':''}${picked.to?'To: '+esc(picked.to)+'<br>':''}Updated ${stamp(picked.updated)}${Object.entries(picked.meta||{}).filter(([,v])=>v).map(([k,v])=>`<br>${esc(k.replace(/_/g,' '))}: ${esc(v)}`).join('')}</div><div class="actions"><button class="btn secondary" data-action="edit">Edit</button><button class="btn secondary" data-action="export">Export file</button><button class="btn danger" data-action="delete">Delete</button></div><div>${esc(picked.body||'No content yet.')}</div>`:`<div class="empty">Select a record or create one.</div>`}</article></div>`}
function field(name,label,value='',wide=false,placeholder=''){return `<label class="field ${wide?'wide':''}">${label}<input name="${name}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`}
function select(name,label,options,value){return `<label class="field">${label}<select name="${name}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}
function extraFields(kind,label,x){let m=x?.meta||{},f=(key,title,wide=false,hint='')=>field('meta_'+key,title,m[key]||'',wide,hint);
 if(kind==='submission'){
  let common=f('received','Date received')+f('source','Source / platform');
  let specific={
   'Guest pitch':f('guest','Proposed guest / organization')+f('topic','Proposed topic')+f('promotion','Product or service they want to promote',true),
   'Hatemail':f('sender_handle','Sender handle')+f('complaint','What set them off?'),
   'Listener mail':f('sender_handle','Listener handle')+f('episode','Episode referenced'),
   'Interview':f('guest','Guest')+f('episode','Related episode')+f('questions','Questions / angle',true),
   'Episode idea':f('angle','Premise / angle',true)+f('characters','Characters involved'),
   'Production note':f('episode','Related episode')+f('owner','Assigned to'),
   'Other':f('context','Context',true)
  };return common+(specific[label]||'')
 }
 if(kind==='episode')return f('number','Episode number')+f('release','Release date')+f('guests','Guests / characters',true)+f('summary','Short description',true);
 if(kind==='draft')return f('characters','Characters / voices')+f('episode','Related episode')+f('purpose','What this piece needs to do',true);
 return f('date','Message date')+select('meta_direction','Direction',['Incoming','Outgoing','Internal'],m.direction||'Incoming')+f('thread','Thread / conversation',true)
}
function editor(){let x=state.items.find(i=>i.id===editing),kind=x?.kind||currentKind(),inbox=kind==='paul'||kind==='derek';let labels=kind==='submission'?TYPES:kind==='episode'?['Planned','Draft','Published']:kind==='draft'?['Script','Dialogue','Idea','Other']:['Inbox','Draft','Sent'];let label=x?.label||labels[0];let titleLabel=inbox?'Subject':kind==='episode'?'Episode title':kind==='draft'?'Working title':'Submission title';let bodyLabel=inbox?'Message':kind==='episode'?'Script / show notes':kind==='draft'?'Draft content':'Submission text';let statuses=kind==='submission'?['New','Reviewing','Accepted','Rejected','Filed']:kind==='episode'?['Planned','Writing','Recording','Editing','Published']:['New','In progress','Waiting','Done','Archived'];return heading(x?'Edit record':'New record',`Writing in ${APPS.find(i=>i[0]===app)[2]}.`)+`<form id="recordForm"><div class="formgrid"><label class="field wide">${titleLabel}<input name="title" required value="${esc(x?.title||'')}"></label>${select('label',kind==='submission'?'Submission type':kind==='episode'?'Archive label':kind==='draft'?'Piece type':'Mailbox',labels,label)}${select('status','Status',statuses,x?.status||statuses[0])}${inbox?field('from','From',x?.from||'')+field('to','To',x?.to||(kind==='paul'?'Paul':'Derek')):kind==='submission'?field('from','Submitted by',x?.from||'')+field('to','Addressed to',x?.to||''):''}<div class="wide formgrid" id="extraFields">${extraFields(kind,label,x)}</div>${select('format','Export format',['text','markdown','html'],x?.format||'text')}<label class="field wide">${bodyLabel}<textarea name="body" spellcheck="true">${esc(x?.body||'')}</textarea></label></div><div class="actions"><button class="btn" type="submit">Save record</button><button class="btn secondary" type="button" data-action="cancel">Cancel</button></div></form>`}
function bind(){document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>go(b.dataset.app));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));let s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;let pos=s.selectionStart;render();document.getElementById('search').focus();document.getElementById('search').setSelectionRange(pos,pos)};let f=document.getElementById('filter');if(f)f.onchange=()=>{filter=f.value;render()};let form=document.getElementById('recordForm');if(form){let label=form.elements.label;if(currentKind()==='submission')label.onchange=()=>{let values=new FormData(form),old=state.items.find(x=>x.id===editing),meta={...(old?.meta||{})};for(let [key,value] of values)if(key.startsWith('meta_'))meta[key.slice(5)]=value;document.getElementById('extraFields').innerHTML=extraFields('submission',label.value,{meta})};form.onsubmit=e=>{e.preventDefault();let d=new FormData(form),kind=currentKind(),old=state.items.find(x=>x.id===editing),meta={...(old?.meta||{})};for(let [key,value] of d)if(key.startsWith('meta_'))meta[key.slice(5)]=String(value);let item={id:old?.id||crypto.randomUUID(),kind,title:String(d.get('title')).trim(),label:d.get('label'),status:d.get('status'),from:d.get('from')||'',to:d.get('to')||'',format:d.get('format'),body:d.get('body'),meta,created:old?.created||new Date().toISOString(),updated:new Date().toISOString()};if(old)Object.assign(old,item);else state.items.push(item);save();selected=item.id;editing=null;render()}}}
function action(a){if(a==='backup')return exportJSON();if(a==='import')return document.getElementById('importFile').click();if(a==='new'){editing='new';return render()}if(a==='cancel'){editing=null;return render()}if(a==='edit'){editing=selected;return render()}let x=state.items.find(i=>i.id===selected);if(!x)return;if(a==='export')return exportItem(x);if(a==='delete'&&confirm(`Delete “${x.title}”? This cannot be undone unless it is in a backup.`)){state.items=state.items.filter(i=>i.id!==x.id);selected=null;save();render()}}
document.getElementById('backupTop').onclick=exportJSON;document.getElementById('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let incoming=JSON.parse(await file.text());if(incoming.version!==1||!Array.isArray(incoming.items)||!incoming.items.every(x=>x&&typeof x.id==='string'&&typeof x.kind==='string'&&typeof x.body==='string'))throw Error('Not a valid Studio backup');if(confirm(`Replace the current ${state.items.length} records with ${incoming.items.length} records from this backup?`)){state=incoming;save();go('home')}}catch(err){alert('Could not import: '+err.message)}e.target.value=''};render();
})();
</script>
</body></html>
