<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episode 11: Dr. Alters Interview (Part 1)</title>
  <style>
    @import url("https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.9.0-alpha2/katex.min.css");

    body {
      font-family: Georgia, Cambria, serif;
      font-size: 14px;
      line-height: 1.7;
      color: #373D49;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .chat { display: flex; flex-direction: column; gap: 1.35rem; margin: 2rem 0; }
    .message { display: flex; max-width: 78%; }
    .message.host { justify-content: flex-end; margin-left: auto; }
    .message.guest { justify-content: flex-start; }
    .bubble {
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 18px;
      border: 3px solid #202024;
      line-height: 1.7;
      box-shadow: 6px 6px 0 #202024;
    }
    .host .bubble { background: #c7d5ff; border-bottom-right-radius: 5px; }
    .guest .bubble { background: #ffc9d7; border-bottom-left-radius: 5px; }
    .message p { margin: 0; }
    .message + .message { margin-top: .35rem; }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      .message { max-width: 92%; }
    }
    @media print { .message { break-inside: avoid; } }
  
    .message .bubble p + p { margin-top: 0.9rem; }
    @media screen and (prefers-reduced-motion: no-preference) {
      .message.reveal-pending {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 650ms ease, transform 650ms ease;
      }
      .message.reveal-pending.revealed {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .stage-direction {
      align-self: center;
      max-width: 78%;
      color: #666;
      text-align: center;
      margin: 0.25rem auto;
    }
    .stage-direction p { margin: 0; }
</style>
</head>
<body id="preview">
  <h1></h1>

  <h1></h1>
  <div class="chat">
  <div class="message host">
    <div class="bubble"><p><strong>Derek:</strong> </p></div>
  </div>
  <div class="message guest">
    <div class="bubble"><p><strong>Guest:</strong> </p></div>
  </div>
  <div class="message host">
    <div class="bubble"><p><strong>Derek:</strong> </p></div>
  </div>
  <div class="stage-direction"><p><em>Guest laughs.</em></p></div>
  <div class="message guest">
    <div class="bubble"><p><strong>Guest:</strong> </p></div>
  </div>

  </div>
  </div>
</body>
</html>
