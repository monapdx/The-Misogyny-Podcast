<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Is It a Human? — Flowchart</title>
  <style>
    :root { --ink:#080808; --paper:#f6f4ef; --pink:#ff2bd6; --lime:#39ff14; --cyan:#00e5ff; --yellow:#fffb00; --purple:#8c00ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 18px 60px;
      color: var(--ink); background: var(--paper);
      background-image: radial-gradient(#c9c6bf 1px, transparent 1px);
      background-size: 20px 20px; font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(900px, 100%); margin: auto; }
    h1 { margin: 0 0 8px; font: 900 clamp(2rem,6vw,4rem)/.95 Impact,"Arial Black",sans-serif; text-transform: uppercase; letter-spacing: .015em; }
    .subtitle { margin: 0 0 26px; font-weight: 700; }
    .chart {
      position: relative; width: 100%; aspect-ratio: 9 / 8; min-height: 660px;
      border: 4px solid var(--ink); background: #fff; box-shadow: 10px 10px 0 var(--purple); overflow: hidden;
    }
    .lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    .line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; marker-end: url(#arrow); }
    .node {
      position: absolute; z-index: 2; display: grid; place-items: center; padding: 14px;
      border: 4px solid var(--ink); color: var(--ink); text-align: center; font-weight: 900;
      text-transform: uppercase; box-shadow: 7px 7px 0 var(--ink);
    }
    .start { left: 31%; top: 6%; width: 38%; height: 15%; background: var(--cyan); font-size: clamp(1.25rem,3.5vw,2rem); }
    .question { left: 31%; top: 36%; width: 38%; height: 17%; background: var(--yellow); font-size: clamp(1.15rem,3vw,1.75rem); }
    .answer { top: 74%; width: 29%; height: 14%; font-size: clamp(1.2rem,3.2vw,1.9rem); }
    .yes { left: 8%; background: var(--lime); }
    .no { right: 8%; background: var(--pink); }
    .branch-label {
      position: absolute; z-index: 3; top: 60%; padding: 4px 9px; border: 3px solid var(--ink);
      background: #fff; font-size: .78rem; font-weight: 900; box-shadow: 3px 3px 0 var(--ink);
    }
    .label-yes { left: 23%; transform: rotate(-3deg); }
    .label-no { right: 23%; transform: rotate(3deg); }
    .footnote { margin: 18px 0 0; font-size: .8rem; font-style: italic; text-align: right; }
    @media (max-width: 620px) {
      .chart { min-height: 580px; aspect-ratio: 3 / 4; }
      .start,.question { left: 18%; width: 64%; }
      .answer { width: 38%; }
      .yes { left: 5%; } .no { right: 5%; }
      .label-yes { left: 16%; } .label-no { right: 16%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Derek's Field Guide to Humanity</h1>
    <p class="subtitle">A complete and scientifically rigorous classification system.</p>
    <section class="chart" aria-label="Flowchart asking if someone is human based on whether they have a penis">
      <svg class="lines" viewBox="0 0 900 800" preserveAspectRatio="none" aria-hidden="true">
        <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#080808"/></marker></defs>
        <path class="line" d="M450 168 L450 288"/>
        <path class="line" d="M450 424 L450 505 L205 505 L205 588"/>
        <path class="line" d="M450 424 L450 505 L695 505 L695 588"/>
      </svg>
      <div class="node start">Is it a human?</div>
      <div class="node question">Does it have a penis?</div>
      <span class="branch-label label-yes">YES</span>
      <span class="branch-label label-no">NO</span>
      <div class="node answer yes">Human</div>
      <div class="node answer no">Not Human</div>
    </section>
    <p class="footnote">Peer review was deemed unnecessary.</p>
  </main>
</body>
</html>
