<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>

:root {
  --pink: #ff20d4;
  --lime: #16ff00;
  --violet: #8c00ff;
  --black: #050505;
}
* { box-sizing: border-box; }
html { background: #f1f1f1; }
body {
  max-width: 980px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 64px 72px 120px;
  background: #fff;
  color: #080808;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
h1, h2, h3, h4 { color: #000; font-weight: 800; line-height: 1.2; }
h3 { margin: 2.15rem 0 0.6rem; font-size: 1.24rem; }
p { margin: 0.7rem 0 1rem; }
a { color: #111; text-decoration-thickness: 2px; }
ul { padding-left: 1.5rem; }
.contains-task-list { padding-left: 0; }
.task-list-item { list-style: none; }
.task-list-item input {
  width: 1rem;
  height: 1rem;
  margin-right: 0.45rem;
  accent-color: var(--pink);
}
table {
  width: auto;
  max-width: 100%;
  margin: 2.1rem 0 1.25rem;
  border-collapse: collapse;
  border: 4px solid var(--black);
  background: #fff;
}
th, td {
  padding: 6px 10px;
  border: 3px solid var(--black);
  vertical-align: top;
  text-align: left;
}
thead th { background: var(--pink); color: #000; font-weight: 800; }
tbody td:first-child { background: #f0f0f0; font-weight: 800; white-space: nowrap; }
code {
  padding: 0.08em 0.27em;
  background: var(--black);
  color: var(--lime);
  font-family: Consolas, "Cascadia Code", monospace;
  font-size: 0.88em;
  font-weight: 700;
}
pre {
  overflow-x: auto;
  margin: 1.25rem 0 1rem;
  padding: 22px 20px;
  border-left: 5px solid var(--pink);
  border-right: 5px solid var(--violet);
  border-radius: 4px;
  background: #030303;
  color: var(--lime);
  line-height: 1.45;
}
pre code {
  padding: 0;
  background: transparent;
  color: inherit;
  font-size: 0.92rem;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 1rem 0 1.25rem;
  border: 3px solid #000;
}
blockquote {
  margin: 1.25rem 0;
  padding: 0.8rem 1rem;
  border-left: 5px solid var(--violet);
  background: #f3f3f3;
}
hr { height: 4px; border: 0; background: var(--black); }
@media (max-width: 760px) {
  body { padding: 34px 22px 72px; }
  table { width: 100%; font-size: 0.88rem; }
  th, td { padding: 5px 7px; }
  tbody td:first-child { white-space: normal; }
}
@media print {
  html, body { background: #fff; }
  body { max-width: none; padding: 0.5in; }
  pre, table, img { break-inside: avoid; }
}
  </style>
</head>
<body>

</body>
</html>
